name: Phase43 offline contract tests (template, not installed)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase43:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s phase43_tests -v
      - run: python run_all_tests.py
