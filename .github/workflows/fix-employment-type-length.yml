name: Align employment type length

on:
  push:
    branches:
      - feat/client-employment-onboarding

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align field length and clean up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path("apps/backend/database/schemas/company_clients.py")
          text = schema.read_text()
          old = 'employment_type: str | None = Field(default=None, max_length=100)'
          new = 'employment_type: str | None = Field(default=None, max_length=50)'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one schema match, found {text.count(old)}")
          schema.write_text(text.replace(old, new, 1))

          component = Path("apps/frontend/components/clients/employer-group-registration-field.tsx")
          text = component.read_text()
          old = '          placeholder="e.g. Retail shop, construction, farming, consulting"\n        />'
          new = '          placeholder="e.g. Retail shop, construction, farming, consulting"\n          maxLength={50}\n        />'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one frontend match, found {text.count(old)}")
          component.write_text(text.replace(old, new, 1))

          Path(".github/workflows/fix-employment-type-length.yml").unlink()
          PY
      - name: Commit aligned constraints
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align assisted employment type length"
          git push
