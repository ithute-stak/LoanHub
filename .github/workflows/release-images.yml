name: LoanHub Release Images

on:
  workflow_run:
    workflows: ["LoanHub CI"]
    types: [completed]

concurrency:
  group: loanhub-release-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish tested images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/loanhub-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/loanhub-frontend

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.loanhub.co.ls/api/v1
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Release summary
        run: |
          echo "Backend: ${BACKEND_IMAGE}:${RELEASE_SHA}"
          echo "Frontend: ${FRONTEND_IMAGE}:${RELEASE_SHA}"
