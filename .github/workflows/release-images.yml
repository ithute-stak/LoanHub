name: LoanHub Release Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: loanhub-release-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish tested images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_SHA: ${{ github.sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/loanhub-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/loanhub-frontend
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Require successful CI for exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Checking LoanHub CI for ${TARGET_SHA}"
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="${TARGET_SHA}" -f per_page=30 -f event=push 2>/dev/null || true)"
            conclusion="$(echo "$runs" | jq -r '[.workflow_runs[]? | select(.head_sha == env.TARGET_SHA and .event == "push")] | sort_by(.created_at) | last | .conclusion // empty' 2>/dev/null || true)"
            case "$conclusion" in
              success) echo "CI passed for ${TARGET_SHA}"; break ;;
              failure|cancelled|timed_out|action_required|skipped)
                echo "CI has not passed for ${TARGET_SHA}: $conclusion" >&2
                exit 1 ;;
              *)
                if [ "$attempt" -eq 90 ]; then
                  echo "No successful main-branch CI for ${TARGET_SHA} within 30 minutes" >&2
                  exit 1
                fi
                sleep 20 ;;
            esac
          done

      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate GHCR credentials
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME" || { echo 'Missing GHCR_USERNAME repository secret.' >&2; exit 1; }
          test -n "$GHCR_TOKEN" || { echo 'Missing GHCR_TOKEN repository secret.' >&2; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_SHA }}

      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.loanhub.co.ls/api/v1
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_SHA }}

      - name: Release summary
        run: |
          echo "LoanHub images are published only; no VPS deployment is performed."
          echo "Backend: ${BACKEND_IMAGE}:${RELEASE_SHA}"
          echo "Frontend: ${FRONTEND_IMAGE}:${RELEASE_SHA}"
          echo "Deploy manually from the production VPS only after this workflow is green."
