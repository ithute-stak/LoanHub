name: Extract LoanHub from Ithute

on:
  push:
    paths:
      - ".github/workflows/extract-loanhub.yml"

permissions:
  contents: write

jobs:
  extract:
    name: Extract standalone LoanHub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Extract the product at the recorded source revision
        env:
          SOURCE_REPOSITORY: https://github.com/ithute-stak/ithute.git
          SOURCE_REVISION: d1d5587963ee56da4fc8fbf9ebd9f03a9cbcba4c
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          git clone --filter=blob:none --no-checkout "$SOURCE_REPOSITORY" "$source_dir"
          git -C "$source_dir" checkout --detach "$SOURCE_REVISION"
          git -C "$source_dir" archive --format=tar "$SOURCE_REVISION:products/LoanHub" | tar -xf - -C "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("product.manifest.yaml")
          manifest.write_text(
              manifest.read_text(encoding="utf-8").replace(
                  "source_path: products/LoanHub", "source_path: ."
              ),
              encoding="utf-8",
          )
          Path("MIGRATION.md").write_text(
              "# LoanHub\n\n"
              "Standalone repository extracted from `ithute-stak/ithute` at "
              "`d1d5587963ee56da4fc8fbf9ebd9f03a9cbcba4c` on 2026-09-12.\n\n"
              "LoanHub owns its product code, database, cache, deployment assets and documentation. "
              "Ithute Auth, Push and Realtime remain central services consumed only through their "
              "public contracts; their source, infrastructure, credentials and data are intentionally "
              "not copied here.\n",
              encoding="utf-8",
          )
          PY

      - name: Commit the standalone product
        run: |
          set -euo pipefail
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract LoanHub from Ithute monorepo"
          git push origin HEAD:main
