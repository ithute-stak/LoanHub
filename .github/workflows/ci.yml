name: LoanHub CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: loanhub-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_db
          POSTGRES_USER: loanhub
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loanhub -d loan_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-loanhub-secret-key-not-for-production
      FERNET_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CHAT_ENCRYPTION_KEY: ci-only-chat-encryption-key
      FILE_ENCRYPTION_KEY: ci-only-file-encryption-key
      RATE_LIMIT_ENABLED: 'false'
      METRICS_ENABLED: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: loan_db
      DB_USER: loanhub
      DB_PASSWORD: ci-only-postgres-password
      DB_RUNTIME_USER: loanhub_app
      DB_RUNTIME_PASSWORD: ci-only-runtime-postgres-password
      LOANHUB_VALIDATE_LIVE_MIGRATIONS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Generate ephemeral CI JWT keys
        run: |
          set -euo pipefail
          key_dir="$GITHUB_WORKSPACE/.ci-secrets"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$key_dir/jwt_private.pem" >/dev/null 2>&1
          openssl pkey \
            -in "$key_dir/jwt_private.pem" \
            -pubout \
            -out "$key_dir/jwt_public.pem" >/dev/null 2>&1
          chmod 600 "$key_dir/jwt_private.pem"
          chmod 644 "$key_dir/jwt_public.pem"
          printf 'JWT_PRIVATE_KEY_PATH=%s\n' "$key_dir/jwt_private.pem" >> "$GITHUB_ENV"
          printf 'JWT_PUBLIC_KEY_PATH=%s\n' "$key_dir/jwt_public.pem" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt -r apps/backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: pnpm --dir apps/frontend install --frozen-lockfile

      - name: Compile polyglot workers
        run: |
          set -euo pipefail
          cargo check --manifest-path services/compute-rust/Cargo.toml
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path apps/frontend/wasm/loanhub-compute/Cargo.toml --target wasm32-unknown-unknown --release
          (cd services/worker-go && go test ./... && go build ./...)
          mvn -q -f services/worker-java/pom.xml test package
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          cmake -S services/native-cpp -B /tmp/loanhub-native-build
          cmake --build /tmp/loanhub-native-build --config Release
          test "$(/tmp/loanhub-native-build/loanhub_native simple-interest 100000 36000 3)" = "9000"
          test "$(/tmp/loanhub-native-build/loanhub_native simple-flat-preview 100000 36000 3 0)" = "36333|9000|109000|36333,36333,36334"
          test "$(/tmp/loanhub-native-build/loanhub_native micro-loan-preview 100000 20000 3 0)" = "46400|39200|139200|46400,46400,46400"
          test "$(/tmp/loanhub-native-build/loanhub_native reducing-balance-preview 100000 36000 3 0)" = "35353|6059|106059|35353,35353,35353"
          test "$(/tmp/loanhub-native-build/loanhub_native compound-interest-preview 100000 36000 3 0)" = "36333|9273|109273|36333,36423,36517"
          test "$(/tmp/loanhub-native-build/loanhub_native daily-accrual-preview 100000 36000 3 0 2024-04-24 2024-05-24,2024-06-24,2024-07-24)" = "35335|6006|106006|35335,35335,35336"
          test "$(printf '100000|0|1|0|1|current\n50000|35|1|1|0|31-60\n25000|95|1|1|1|90+\n90000|10|0|1|1|8-30\n' | /tmp/loanhub-native-build/loanhub_native portfolio-risk-core)" = "175000|3|75000|75000|75000|25000|25000|75000|125000|1|100000|0|0|0|0|1|50000|0|0|1|25000"
          groups_output="$(printf '100000|120000|0|1|0|0|1|0|0|0|0|1|2026-01-01\n50000|60000|35|1|0|1|1|1|0|1|1|1|2026-01-01\n25000|30000|95|1|1|1|0|0|1|1|1|1|2025-12-01\n90000|100000|10|0|0|0|1|0|1|0|0|1|2025-12-01\n' | /tmp/loanhub-native-build/loanhub_native portfolio-risk-groups)"
          test "$groups_output" = "$(printf 'C|B|0|2|150000|50000|2|1\nC|B|1|1|25000|25000|0|0\nC|P|0|1|100000|0|1|0\nC|P|1|2|75000|75000|1|1\nC|E|0|1|100000|0|1|0\nC|E|1|2|75000|75000|1|1\nV|2025-12-01|2|130000|90000|0|1|0|1|1\nV|2026-01-01|2|180000|150000|50000|2|1|0|1\nT|0|2|100000|0|2|0|0\nT|1|2|75000|75000|1|1|1')"

      - name: Run project validation
        run: |
          set -euo pipefail
          bash ./scripts/validate_project.sh

      - name: Verify PostgreSQL tenant isolation
        working-directory: apps/backend
        run: |
          python -m pytest -q tests/test_database_tenant_context.py tests/test_database_rls_pilot.py tests/test_database_management_contract.py
          python scripts/verify_rls_pilot.py

      - name: Validate system-owner recovery helper
        run: |
          set -euo pipefail
          python -m py_compile apps/backend/scripts/sync_system_owner.py
          grep -Fq 'DEFAULT_SYSTEM_OWNER_PHONE = "59001394"' apps/backend/scripts/sync_system_owner.py
          grep -Fq 'password = os.getenv("SYSTEM_OWNER_PASSWORD", "")' apps/backend/scripts/sync_system_owner.py
          grep -Fq 'SYSTEM_OWNER_PASSWORD: ${{ secrets.LOANHUB_SYSTEM_OWNER_PASSWORD }}' .github/workflows/system-owner-access.yml
          echo 'System-owner recovery uses the protected GitHub Actions secret and contains no embedded password value.'

      - name: Build polyglot worker images
        run: |
          set -euo pipefail
          docker build -f services/compute-rust/Dockerfile -t loanhub-rust-compute-ci:${{ github.sha }} services
          docker build -t loanhub-go-worker-ci:${{ github.sha }} services/worker-go
          docker build -t loanhub-java-worker-ci:${{ github.sha }} services/worker-java

      - name: Build backend production image
        run: docker build -t loanhub-backend-ci:${{ github.sha }} apps/backend

      - name: Build frontend production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.loanhub.co.ls/api/v1 \
            -t loanhub-frontend-ci:${{ github.sha }} \
            apps/frontend
