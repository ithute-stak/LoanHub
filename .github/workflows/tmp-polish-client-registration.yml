name: Temporary client registration polish

on:
  push:
    branches:
      - fix/client-bank-account-readable-input
    paths:
      - .github/workflows/tmp-polish-client-registration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/client-bank-account-readable-input

      - name: Polish assisted borrower registration form
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/frontend/app/(dashboard)/company/clients/page.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '                <div className="space-y-5 p-4 sm:p-6 lg:p-7">',
              '                <div className="space-y-6 p-4 sm:p-6 lg:p-8">',
              'form content spacing',
          )

          replace_once(
              '''  return (\n    <div className="space-y-2">\n      <div className="space-y-0.5">\n        <Label className="text-sm font-bold">\n          {label}{required ? <span className="ml-1 text-destructive">*</span> : null}\n        </Label>\n        {description ? <p className="text-[11px] leading-4 text-muted-foreground">{description}</p> : null}\n      </div>\n      {children}\n    </div>\n  );''',
              '''  return (\n    <div className="group rounded-2xl border border-border/50 bg-muted/[0.22] p-3.5 transition-all duration-200 hover:border-border/80 hover:bg-muted/30 focus-within:border-primary/30 focus-within:bg-background focus-within:shadow-sm">\n      <div className="mb-2.5 space-y-1">\n        <Label className="text-xs font-black tracking-[0.01em] text-foreground/90">\n          {label}{required ? <span className="ml-1 text-destructive">*</span> : null}\n        </Label>\n        {description ? <p className="text-[11px] leading-4 text-muted-foreground/90">{description}</p> : null}\n      </div>\n      {children}\n    </div>\n  );''',
              'Field component',
          )

          replace_once(
              '''  return (\n    <Card className="overflow-hidden rounded-3xl border-border/70 shadow-none">\n      <CardHeader className="border-b bg-muted/20 px-5 py-4 sm:px-6">\n        <div className="flex items-start gap-3">\n          <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-primary/10 text-primary">\n            <Icon className="h-5 w-5" />\n          </div>\n          <div>\n            <CardTitle className="text-base">{title}</CardTitle>\n            <CardDescription className="mt-1">{description}</CardDescription>\n          </div>\n        </div>\n      </CardHeader>\n      <CardContent className="space-y-4 p-5 sm:p-6">{children}</CardContent>\n    </Card>\n  );''',
              '''  return (\n    <Card className="overflow-hidden rounded-[28px] border border-border/60 bg-card/95 shadow-sm shadow-black/5">\n      <CardHeader className="border-b border-border/60 bg-gradient-to-r from-primary/[0.08] via-background to-emerald-500/[0.05] px-5 py-5 sm:px-6">\n        <div className="flex items-start gap-3.5">\n          <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-primary/15 bg-primary/10 text-primary shadow-sm">\n            <Icon className="h-5 w-5" />\n          </div>\n          <div className="min-w-0">\n            <CardTitle className="text-base font-black tracking-tight">{title}</CardTitle>\n            <CardDescription className="mt-1 max-w-3xl text-xs leading-5 sm:text-sm">{description}</CardDescription>\n          </div>\n        </div>\n      </CardHeader>\n      <CardContent className="space-y-5 bg-gradient-to-b from-background to-muted/10 p-4 sm:p-6">{children}</CardContent>\n    </Card>\n  );''',
              'FormSection component',
          )

          replace_once(
              '          <div className="flex shrink-0 flex-col gap-3 bg-muted/30 px-4 py-4 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-7">',
              '          <div className="flex shrink-0 flex-col gap-3 border-t border-border/60 bg-background/95 px-4 py-4 shadow-[0_-10px_30px_-24px_rgba(0,0,0,0.35)] backdrop-blur sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-7">',
              'wizard footer',
          )

          path.write_text(text)
          PY

      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-polish-client-registration.yml
          git config user.name "LoanHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'apps/frontend/app/(dashboard)/company/clients/page.tsx' .github/workflows/tmp-polish-client-registration.yml
          git diff --cached --check
          git commit -m "style(clients): polish assisted registration forms"
          git push origin HEAD:fix/client-bank-account-readable-input
