name: Temporary client banking step patch

on:
  push:
    branches:
      - feat/client-registration-banking-step
    paths:
      - .github/workflows/tmp-client-banking-step.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/client-registration-banking-step

      - name: Patch borrower registration wizard
        shell: bash
        run: |
          python scripts/tmp_patch_client_banking.py

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/tmp-client-banking-step.yml
          rm scripts/tmp_patch_client_banking.py
          git config user.name "LoanHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/frontend/app/'(dashboard)'/company/clients/page.tsx \
            apps/frontend/components/clients/client-banking-registration-step.tsx \
            .github/workflows/tmp-client-banking-step.yml \
            scripts/tmp_patch_client_banking.py
          git diff --cached --check
          git commit -m "feat(clients): add banking to assisted registration"
          git push origin HEAD:feat/client-registration-banking-step
