name: Temporary CDAS reintegration reset

on:
  push:
    branches:
      - cdas-reintegration

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cdas-reintegration
          fetch-depth: 0

      - name: Reset CDAS to authentication-only foundation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          def delete_glob(directory: str, pattern: str, keep: set[str] | None = None):
              keep = keep or set()
              path = root / directory
              if not path.exists():
                  return
              for item in path.glob(pattern):
                  if item.name not in keep and item.is_file():
                      item.unlink()

          # Remove all CDAS business/runtime services and routers. Keep only the
          # authentication/configuration foundation that will be rebuilt below.
          delete_glob('apps/backend/services', 'cdas_*.py', {'cdas_config_service.py'})
          delete_glob('apps/backend/routers', 'cdas_*.py', {'cdas_api.py'})
          delete_glob('apps/backend/tests', 'test_cdas_*.py')

          # Remove CDAS-specific frontend pages/components by path. Shared client,
          # loan and settings screens remain and will be cleaned of stale links.
          frontend = root / 'apps/frontend'
          if frontend.exists():
              targets = sorted(
                  [p for p in frontend.rglob('*') if 'cdas' in p.name.lower()],
                  key=lambda p: len(p.parts),
                  reverse=True,
              )
              for target in targets:
                  if not target.exists():
                      continue
                  if target.is_dir():
                      shutil.rmtree(target)
                  else:
                      target.unlink()

          # Remove CDAS background schedulers from application startup.
          main_path = root / 'apps/backend/main.py'
          main = main_path.read_text()
          main = re.sub(
              r'from services\.cdas_client_roster_sync_scheduler import \(\n.*?\n\)\n',
              '', main, flags=re.S,
          )
          main = re.sub(
              r'from services\.cdas_monthly_automation_scheduler import \(\n.*?\n\)\n',
              '', main, flags=re.S,
          )
          main = main.replace('    cdas_roster_sync_started = False\n', '')
          main = main.replace('    cdas_automation_started = False\n', '')
          main = re.sub(
              r'            # Roster sync bootstraps.*?            cdas_roster_sync_started = True\n',
              '', main, flags=re.S,
          )
          main = re.sub(
              r'            # CDAS payroll automation.*?            cdas_automation_started = True\n',
              '', main, flags=re.S,
          )
          main = re.sub(
              r'        if cdas_automation_started:\n            await stop_cdas_monthly_automation_scheduler\(\)\n',
              '', main,
          )
          main = re.sub(
              r'        if cdas_roster_sync_started:\n            await stop_cdas_client_roster_sync_scheduler\(\)\n',
              '', main,
          )
          main_path.write_text(main)

          # Keep only the auth/config router in the central API router.
          api_router_path = root / 'apps/backend/api/v1/router.py'
          lines = api_router_path.read_text().splitlines()
          filtered = []
          for line in lines:
              lowered = line.lower()
              if 'cdas_' in lowered and 'cdas_api' not in lowered:
                  continue
              filtered.append(line)
          api_router_path.write_text('\n'.join(filtered) + '\n')

          # Remove obvious operational navigation links from shared frontend
          # files while leaving generic screens intact. Any remaining references
          # are printed below and treated as reintegration work, not silently used.
          for path in frontend.rglob('*.tsx') if frontend.exists() else []:
              text = path.read_text()
              if '/company/cdas' not in text and '/cdas-' not in text:
                  continue
              new_lines = [
                  line for line in text.splitlines()
                  if '/company/cdas' not in line and '/cdas-' not in line
              ]
              path.write_text('\n'.join(new_lines) + '\n')

          (root / 'apps/backend/integrations/cdas.py').write_text(r'''from __future__ import annotations

import asyncio
from dataclasses import dataclass
from datetime import datetime, timedelta, timezone
from typing import Any

import httpx

from database.config.config import settings


@dataclass(slots=True)
class CdasError(Exception):
    status_code: int
    message: str
    details: Any = None

    def __str__(self) -> str:
        return self.message


class CdasConfigurationError(CdasError):
    pass


@dataclass(slots=True)
class _TokenState:
    value: str
    obtained_at: datetime
    last_used_at: datetime


class CdasClient:
    """Authentication-only CDAS client used during the clean reintegration.

    No employee, affordability, deduction, document or lifecycle endpoint is
    exposed from this class. New provider operations must be reintroduced
    deliberately behind the new safety gateway and tested independently.
    """

    LOGIN_PATH = "/api/security/login"
    _TOKEN_MAX_AGE = timedelta(hours=7, minutes=50)
    _TOKEN_IDLE_AGE = timedelta(minutes=9)

    def __init__(
        self,
        *,
        base_url: str | None = None,
        username: str | None = None,
        password: str | None = None,
        timeout_seconds: float | None = None,
        transport: httpx.AsyncBaseTransport | None = None,
    ) -> None:
        self.base_url = (base_url or "").rstrip("/")
        self.username = username
        self.password = password
        self.timeout_seconds = timeout_seconds or settings.CDAS_TIMEOUT_SECONDS
        self.transport = transport
        self._token: _TokenState | None = None
        self._token_lock = asyncio.Lock()
        self._session_cookies = httpx.Cookies()

    def _require_configuration(self) -> None:
        if not self.base_url or not self.username or not self.password:
            raise CdasConfigurationError(
                status_code=503,
                message="CDAS authentication credentials are incomplete",
            )

    @staticmethod
    def _now() -> datetime:
        return datetime.now(timezone.utc)

    def _token_is_fresh(self) -> bool:
        token = self._token
        if token is None:
            return False
        now = self._now()
        return (
            now - token.obtained_at < self._TOKEN_MAX_AGE
            and now - token.last_used_at < self._TOKEN_IDLE_AGE
        )

    @staticmethod
    def _decode_response(response: httpx.Response) -> Any:
        if not response.content:
            return None
        try:
            return response.json()
        except ValueError:
            return response.text.strip()

    @staticmethod
    def _extract_message(payload: Any, fallback: str) -> str:
        if isinstance(payload, dict):
            for key in ("message", "Message", "detail", "Detail", "error", "Error"):
                value = payload.get(key)
                if value:
                    return str(value)
        if isinstance(payload, str) and payload:
            return payload
        return fallback

    def _error_from_response(self, response: httpx.Response, payload: Any) -> CdasError:
        return CdasError(
            status_code=response.status_code,
            message=self._extract_message(
                payload,
                f"CDAS authentication failed with status {response.status_code}",
            ),
            details=payload,
        )

    async def authenticate(self, *, force: bool = False) -> str:
        """Authenticate and return the token internally to trusted server code."""
        self._require_configuration()
        async with self._token_lock:
            if not force and self._token_is_fresh():
                assert self._token is not None
                self._token.last_used_at = self._now()
                return self._token.value

            async with httpx.AsyncClient(
                base_url=self.base_url,
                timeout=self.timeout_seconds,
                transport=self.transport,
                cookies=httpx.Cookies(),
            ) as client:
                try:
                    response = await client.post(
                        self.LOGIN_PATH,
                        json={"Username": self.username, "Password": self.password},
                    )
                    cookies = httpx.Cookies()
                    cookies.update(client.cookies)
                except httpx.RequestError as exc:
                    raise CdasError(
                        status_code=503,
                        message="CDAS authentication service is unavailable",
                    ) from exc

            payload = self._decode_response(response)
            if response.status_code >= 400:
                raise self._error_from_response(response, payload)
            if not isinstance(payload, dict) or not payload.get("Authorization"):
                raise CdasError(
                    status_code=502,
                    message="CDAS authentication returned an invalid response",
                )

            token_value = str(payload["Authorization"]).strip()
            if not token_value:
                raise CdasError(
                    status_code=502,
                    message="CDAS authentication returned an empty authorization token",
                )

            now = self._now()
            self._session_cookies = cookies
            self._token = _TokenState(
                value=token_value,
                obtained_at=now,
                last_used_at=now,
            )
            return token_value

    async def check_connection(self) -> None:
        """Authenticate without exposing the returned CDAS token to callers."""
        await self.authenticate(force=True)
''')

          (root / 'apps/backend/services/cdas_config_service.py').write_text(r'''from __future__ import annotations

import hashlib
import json
from dataclasses import dataclass
from datetime import datetime, timezone
from typing import Any, Iterable
from urllib.parse import urlparse
from uuid import UUID

from sqlalchemy.orm import Session

from database.config.config import settings
from database.models.origination import OriginationIntegrationConfiguration
from integrations.cdas import CdasClient, CdasConfigurationError, CdasError
from services.crypto_service import decrypt_control_secret, encrypt_control_secret


CDAS_PROVIDER = "cdas"
DEFAULT_TEST_BASE_URL = "https://test-cdas-thirdpartyapi.sentraptt.com"
DEFAULT_TEST_HOST = (urlparse(DEFAULT_TEST_BASE_URL).hostname or "").lower()
PASSWORD_PURPOSE = b"loanhub-cdas-password-v1"
ALLOWED_ENVIRONMENTS = {"test", "live"}


@dataclass(frozen=True, slots=True)
class CdasCompanyCredentials:
    base_url: str
    username: str
    password: str
    timeout_seconds: float
    environment: str


_client_cache: dict[str, tuple[str, CdasClient]] = {}


def _utcnow() -> datetime:
    return datetime.now(timezone.utc)


def _configuration_row(db: Session, company_id: UUID) -> OriginationIntegrationConfiguration | None:
    return (
        db.query(OriginationIntegrationConfiguration)
        .filter(
            OriginationIntegrationConfiguration.company_id == company_id,
            OriginationIntegrationConfiguration.provider == CDAS_PROVIDER,
        )
        .one_or_none()
    )


def get_configuration(db: Session, company_id: UUID) -> OriginationIntegrationConfiguration | None:
    return _configuration_row(db, company_id)


def _validate_base_url(value: str) -> str:
    normalized = value.strip().rstrip("/")
    parsed = urlparse(normalized)
    if parsed.scheme != "https" or not parsed.netloc:
        raise ValueError("CDAS base URL must be a valid HTTPS URL")
    if parsed.username or parsed.password:
        raise ValueError("CDAS base URL must not contain embedded credentials")
    if parsed.query or parsed.fragment:
        raise ValueError("CDAS base URL must not contain a query string or fragment")
    return normalized


def _validate_environment_base_url(environment: str, base_url: str) -> None:
    if environment == "test" and base_url != DEFAULT_TEST_BASE_URL:
        raise ValueError(
            f"CDAS Test environment must use the official test URL {DEFAULT_TEST_BASE_URL}"
        )
    base_host = (urlparse(base_url).hostname or "").lower()
    if environment == "live" and base_host == DEFAULT_TEST_HOST:
        raise ValueError("CDAS Live environment cannot use the CDAS test host")


def _configuration_values(row: OriginationIntegrationConfiguration) -> dict[str, Any]:
    return row.configuration if isinstance(row.configuration, dict) else {}


def _configuration_username(row: OriginationIntegrationConfiguration) -> str:
    return str(_configuration_values(row).get("username") or "").strip()


def _username_conflicts(
    rows: Iterable[OriginationIntegrationConfiguration],
    *,
    company_id: UUID,
    environment: str,
    username: str,
) -> bool:
    candidate = username.strip().casefold()
    return any(
        row.company_id != company_id
        and str(row.environment or "").strip().lower() == environment
        and _configuration_username(row).casefold() == candidate
        for row in rows
    )


def _assert_username_isolated(
    db: Session,
    *,
    company_id: UUID,
    environment: str,
    username: str,
) -> None:
    rows = (
        db.query(OriginationIntegrationConfiguration)
        .filter(
            OriginationIntegrationConfiguration.provider == CDAS_PROVIDER,
            OriginationIntegrationConfiguration.environment == environment,
            OriginationIntegrationConfiguration.company_id != company_id,
        )
        .all()
    )
    if _username_conflicts(
        rows,
        company_id=company_id,
        environment=environment,
        username=username,
    ):
        raise ValueError(
            "This CDAS API username is already assigned to another LoanHub company in the selected environment"
        )


def _serialize_password(password: str) -> str:
    ciphertext, nonce, version = encrypt_control_secret(password, PASSWORD_PURPOSE)
    return json.dumps(
        {"ciphertext": ciphertext, "nonce": nonce, "version": version},
        separators=(",", ":"),
        sort_keys=True,
    )


def _deserialize_password(value: str | None) -> str | None:
    if not value:
        return None
    try:
        payload = json.loads(value)
        return decrypt_control_secret(
            str(payload["ciphertext"]),
            str(payload["nonce"]),
            str(payload["version"]),
            PASSWORD_PURPOSE,
        )
    except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
        raise CdasConfigurationError(
            status_code=503,
            message="The stored CDAS credential could not be verified",
        ) from exc


def configuration_summary(row: OriginationIntegrationConfiguration | None) -> dict[str, Any]:
    if row is None:
        return {
            "provider": CDAS_PROVIDER,
            "environment": "test",
            "enabled": False,
            "base_url": DEFAULT_TEST_BASE_URL,
            "username": "",
            "timeout_seconds": float(settings.CDAS_TIMEOUT_SECONDS),
            "password_configured": False,
            "configured": False,
            "last_test_status": None,
            "last_tested_at": None,
            "reintegration_phase": "authentication_only",
        }

    configuration = _configuration_values(row)
    base_url = str(configuration.get("base_url") or "").strip()
    username = str(configuration.get("username") or "").strip()
    timeout_seconds = float(configuration.get("timeout_seconds") or settings.CDAS_TIMEOUT_SECONDS)
    password_configured = bool(row.encrypted_credentials)
    return {
        "provider": CDAS_PROVIDER,
        "environment": row.environment or "test",
        "enabled": bool(row.is_enabled),
        "base_url": base_url,
        "username": username,
        "timeout_seconds": timeout_seconds,
        "password_configured": password_configured,
        "configured": bool(base_url and username and password_configured),
        "last_test_status": row.last_test_status,
        "last_tested_at": row.last_tested_at.isoformat() if row.last_tested_at else None,
        "reintegration_phase": "authentication_only",
    }


def invalidate_company_client(company_id: UUID) -> None:
    _client_cache.pop(str(company_id), None)


def update_configuration(
    db: Session,
    *,
    company_id: UUID,
    configured_by_user_id: UUID,
    environment: str,
    enabled: bool,
    base_url: str,
    username: str,
    password: str | None,
    clear_password: bool,
    timeout_seconds: float,
) -> OriginationIntegrationConfiguration:
    environment = environment.strip().lower()
    if environment not in ALLOWED_ENVIRONMENTS:
        raise ValueError("CDAS environment must be either test or live")
    base_url = _validate_base_url(base_url)
    _validate_environment_base_url(environment, base_url)
    username = username.strip()
    if not username:
        raise ValueError("CDAS username is required")
    if not 1 <= timeout_seconds <= 120:
        raise ValueError("CDAS timeout must be between 1 and 120 seconds")
    if clear_password and password:
        raise ValueError("Provide a new password or clear the existing password, not both")

    _assert_username_isolated(
        db,
        company_id=company_id,
        environment=environment,
        username=username,
    )

    row = _configuration_row(db, company_id)
    previous_environment = str(row.environment or "test").strip().lower() if row else None
    environment_changed = row is not None and previous_environment != environment
    if row is None:
        row = OriginationIntegrationConfiguration(company_id=company_id, provider=CDAS_PROVIDER)
        db.add(row)

    encrypted_credentials = None if environment_changed else row.encrypted_credentials
    if clear_password:
        encrypted_credentials = None
    elif password:
        encrypted_credentials = _serialize_password(password)

    if enabled and not encrypted_credentials:
        raise ValueError("A CDAS password must be configured before authentication can be enabled")

    # Deliberately discard all legacy CDAS automation/intelligence settings.
    row.environment = environment
    row.is_enabled = enabled
    row.configuration = {
        "base_url": base_url,
        "username": username,
        "timeout_seconds": float(timeout_seconds),
    }
    row.encrypted_credentials = encrypted_credentials
    row.configured_by_user_id = configured_by_user_id
    row.last_test_status = None
    row.last_tested_at = None
    db.commit()
    db.refresh(row)
    invalidate_company_client(company_id)
    return row


def _credentials_from_row(
    row: OriginationIntegrationConfiguration | None,
    *,
    require_enabled: bool,
) -> CdasCompanyCredentials:
    if row is None:
        raise CdasConfigurationError(503, "CDAS authentication is not configured for this company")
    if require_enabled and not row.is_enabled:
        raise CdasConfigurationError(503, "CDAS authentication is disabled for this company")

    configuration = _configuration_values(row)
    try:
        base_url = _validate_base_url(str(configuration.get("base_url") or ""))
    except ValueError as exc:
        raise CdasConfigurationError(503, "This company's CDAS base URL is invalid") from exc
    username = str(configuration.get("username") or "").strip()
    if not username:
        raise CdasConfigurationError(503, "This company's CDAS username is not configured")
    password = _deserialize_password(row.encrypted_credentials)
    if not password:
        raise CdasConfigurationError(503, "This company's CDAS password is not configured")
    try:
        timeout_seconds = float(configuration.get("timeout_seconds") or settings.CDAS_TIMEOUT_SECONDS)
    except (TypeError, ValueError) as exc:
        raise CdasConfigurationError(503, "This company's CDAS timeout is invalid") from exc
    environment = str(row.environment or "test").strip().lower()
    if environment not in ALLOWED_ENVIRONMENTS:
        raise CdasConfigurationError(503, "This company's CDAS environment is invalid")
    try:
        _validate_environment_base_url(environment, base_url)
    except ValueError as exc:
        raise CdasConfigurationError(503, "This company's CDAS environment and base URL do not match") from exc
    return CdasCompanyCredentials(base_url, username, password, timeout_seconds, environment)


def _client_signature(row: OriginationIntegrationConfiguration) -> str:
    material = json.dumps(
        {
            "environment": row.environment,
            "enabled": bool(row.is_enabled),
            "configuration": _configuration_values(row),
            "encrypted_credentials": row.encrypted_credentials or "",
        },
        sort_keys=True,
        default=str,
        separators=(",", ":"),
    ).encode("utf-8")
    return hashlib.sha256(material).hexdigest()


def get_company_cdas_client(db: Session, company_id: UUID) -> CdasClient:
    row = _configuration_row(db, company_id)
    credentials = _credentials_from_row(row, require_enabled=True)
    assert row is not None
    signature = _client_signature(row)
    cache_key = str(company_id)
    cached = _client_cache.get(cache_key)
    if cached is not None and cached[0] == signature:
        return cached[1]
    client = CdasClient(
        base_url=credentials.base_url,
        username=credentials.username,
        password=credentials.password,
        timeout_seconds=credentials.timeout_seconds,
    )
    _client_cache[cache_key] = (signature, client)
    return client


async def test_company_configuration(db: Session, *, company_id: UUID) -> dict[str, Any]:
    row = _configuration_row(db, company_id)
    credentials = _credentials_from_row(row, require_enabled=False)
    assert row is not None
    client = CdasClient(
        base_url=credentials.base_url,
        username=credentials.username,
        password=credentials.password,
        timeout_seconds=credentials.timeout_seconds,
    )
    try:
        await client.check_connection()
    except CdasError:
        row.last_test_status = "failed"
        row.last_tested_at = _utcnow()
        db.commit()
        invalidate_company_client(company_id)
        raise
    row.last_test_status = "connected"
    row.last_tested_at = _utcnow()
    db.commit()
    db.refresh(row)
    invalidate_company_client(company_id)
    return configuration_summary(row)
''')

          (root / 'apps/backend/routers/cdas_api.py').write_text(r'''from __future__ import annotations

from typing import Literal

from fastapi import APIRouter, Depends, HTTPException
from pydantic import BaseModel, Field
from sqlalchemy.orm import Session

from core.access_control import (
    COMPANY_MANAGEMENT_ROLES,
    TenantContext,
    get_tenant_context,
    require_tenant_roles,
)
from database.session import get_db
from integrations.cdas import CdasError
from services.cdas_config_service import (
    configuration_summary,
    get_configuration,
    test_company_configuration,
    update_configuration,
)


router = APIRouter(prefix="/cdas", tags=["CDAS Authentication"])


class CdasConfigurationUpdateRequest(BaseModel):
    environment: Literal["test", "live"] = "test"
    enabled: bool = False
    base_url: str = Field(min_length=8, max_length=500)
    username: str = Field(min_length=1, max_length=200)
    password: str | None = Field(default=None, max_length=500)
    clear_password: bool = False
    timeout_seconds: float = Field(default=20.0, ge=1, le=120)


def _require_company_manager(context: TenantContext) -> None:
    if context.is_platform_admin or not context.company_id or not context.staff:
        raise HTTPException(status_code=403, detail="A company-scoped membership is required")
    require_tenant_roles(context, COMPANY_MANAGEMENT_ROLES)


def _cdas_http_error(exc: CdasError) -> HTTPException:
    status = exc.status_code if 400 <= exc.status_code <= 599 else 502
    return HTTPException(
        status_code=status,
        detail={"provider": "CDAS", "code": exc.status_code, "message": exc.message},
    )


@router.get("/configuration")
def get_cdas_configuration(
    context: TenantContext = Depends(get_tenant_context),
    db: Session = Depends(get_db),
):
    _require_company_manager(context)
    assert context.company_id is not None
    return configuration_summary(get_configuration(db, context.company_id))


@router.put("/configuration")
def put_cdas_configuration(
    payload: CdasConfigurationUpdateRequest,
    context: TenantContext = Depends(get_tenant_context),
    db: Session = Depends(get_db),
):
    _require_company_manager(context)
    assert context.company_id is not None
    try:
        row = update_configuration(
            db,
            company_id=context.company_id,
            configured_by_user_id=context.user.id,
            environment=payload.environment,
            enabled=payload.enabled,
            base_url=payload.base_url,
            username=payload.username,
            password=payload.password,
            clear_password=payload.clear_password,
            timeout_seconds=payload.timeout_seconds,
        )
    except ValueError as exc:
        raise HTTPException(status_code=422, detail=str(exc)) from exc
    return configuration_summary(row)


@router.post("/configuration/test")
async def test_cdas_configuration(
    context: TenantContext = Depends(get_tenant_context),
    db: Session = Depends(get_db),
):
    _require_company_manager(context)
    assert context.company_id is not None
    try:
        configuration = await test_company_configuration(db, company_id=context.company_id)
    except CdasError as exc:
        raise _cdas_http_error(exc) from exc
    return {"ok": True, "configuration": configuration}
''')

          (root / 'apps/backend/tests/test_cdas_auth_session_negotiation.py').write_text(r'''from __future__ import annotations

import httpx
import pytest

from integrations.cdas import CdasClient, CdasConfigurationError, CdasError


@pytest.mark.asyncio
async def test_authentication_uses_documented_login_payload_and_keeps_cookie_session():
    observed = {}

    async def handler(request: httpx.Request) -> httpx.Response:
        assert request.url.path == "/api/security/login"
        observed["body"] = request.read().decode()
        return httpx.Response(
            200,
            json={"Authorization": "token-123"},
            headers={"Set-Cookie": "CDASSESSION=session-123; Path=/; HttpOnly"},
        )

    client = CdasClient(
        base_url="https://cdas.test",
        username="test-user",
        password="test-password",
        transport=httpx.MockTransport(handler),
    )
    await client.check_connection()
    assert '"Username":"test-user"' in observed["body"]
    assert '"Password":"test-password"' in observed["body"]
    assert client._token is not None
    assert client._token.value == "token-123"
    assert client._session_cookies.get("CDASSESSION") == "session-123"


