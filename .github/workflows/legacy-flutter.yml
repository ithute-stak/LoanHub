name: LoanHub Legacy Flutter CI

on:
  pull_request:
    paths:
      - 'apps/legacy_csv_flutter/**'
      - '.github/workflows/legacy-flutter.yml'
  push:
    branches: [main]
    paths:
      - 'apps/legacy_csv_flutter/**'
      - '.github/workflows/legacy-flutter.yml'

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: apps/legacy_csv_flutter
        run: flutter create --platforms=android --project-name=loanhub_legacy_csv .
      - name: Resolve Flutter packages
        working-directory: apps/legacy_csv_flutter
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: apps/legacy_csv_flutter
        run: flutter analyze lib/main.dart
      - name: Build Android debug APK
        working-directory: apps/legacy_csv_flutter
        run: flutter build apk --debug --dart-define=LOANHUB_API_URL=https://example.invalid/api/v1
