name: LoanHub Legacy Flutter CI

on:
  pull_request:
    paths:
      - 'apps/legacy_csv_flutter/**'
      - '.github/workflows/legacy-flutter.yml'
  push:
    branches: [main]
    paths:
      - 'apps/legacy_csv_flutter/**'
      - '.github/workflows/legacy-flutter.yml'

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files without replacing LoanHub app
        working-directory: apps/legacy_csv_flutter
        run: |
          set -euo pipefail
          cp lib/main.dart /tmp/loanhub-legacy-real-main.dart
          flutter create --platforms=android --project-name=loanhub_legacy_csv .
          cp /tmp/loanhub-legacy-real-main.dart lib/main.dart
          grep -Fq 'class LoanHubLegacyApp' lib/main.dart
          if grep -Fq 'Flutter Demo Home Page' lib/main.dart; then
            echo "Refusing to build Flutter counter demo instead of LoanHub" >&2
            exit 1
          fi
      - name: Assert real LoanHub source survived scaffolding
        working-directory: apps/legacy_csv_flutter
        run: |
          set -euo pipefail
          grep -Fq 'class LoanHubLegacyApp' lib/main.dart
          grep -Fq '/legacy-bank-deductions/' lib/main.dart
      - name: Resolve Flutter packages
        working-directory: apps/legacy_csv_flutter
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: apps/legacy_csv_flutter
        run: flutter analyze lib/main.dart
      - name: Build Android debug APK
        working-directory: apps/legacy_csv_flutter
        run: flutter build apk --debug --dart-define=LOANHUB_API_URL=https://api.loanhub.co.ls/api/v1

      - name: Publish Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: loanhub-legacy-csv-android-debug
          path: apps/legacy_csv_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
