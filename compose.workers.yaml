services:
  backend:
    environment:
      LOANHUB_RUST_COMPUTE_URL: http://rust-compute:8082
      LOANHUB_GO_WORKER_URL: http://go-worker:8081
      LOANHUB_JAVA_WORKER_URL: http://java-worker:8083
      LOANHUB_GO_RECON_HASH_MODE: ${LOANHUB_GO_RECON_HASH_MODE:-prefer-worker}
      LOANHUB_GO_WEBHOOK_DELIVERY_MODE: ${LOANHUB_GO_WEBHOOK_DELIVERY_MODE:-off}
      LOANHUB_GO_PUSH_DELIVERY_MODE: ${LOANHUB_GO_PUSH_DELIVERY_MODE:-off}
      LOANHUB_RUST_RECON_MODE: ${LOANHUB_RUST_RECON_MODE:-prefer-worker}
      LOANHUB_RUST_LOAN_CALC_MODE: ${LOANHUB_RUST_LOAN_CALC_MODE:-shadow}
      LOANHUB_RUST_PORTFOLIO_RISK_MODE: ${LOANHUB_RUST_PORTFOLIO_RISK_MODE:-shadow}
      LOANHUB_RUST_AFFORDABILITY_MODE: ${LOANHUB_RUST_AFFORDABILITY_MODE:-shadow}
      LOANHUB_RUST_PREDICTIVE_RISK_MODE: ${LOANHUB_RUST_PREDICTIVE_RISK_MODE:-shadow}
      LOANHUB_JAVA_UNDERWRITING_MODE: ${LOANHUB_JAVA_UNDERWRITING_MODE:-shadow}
      LOANHUB_JAVA_EVENT_MODE: ${LOANHUB_JAVA_EVENT_MODE:-shadow}
    depends_on:
      rust-compute:
        condition: service_healthy
      go-worker:
        condition: service_healthy

  rust-compute:
    profiles: []

  go-worker:
    profiles: []

  java-worker:
    profiles: []
