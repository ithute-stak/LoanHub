[package]
name = "loanhub-compute-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
